- title: Lectures and slides
  contents:
  - lectures
  - slides
- title: Exercise sheets
  contents:
  - tutorials
  - get_tutorial
- title: Helpers from the slides
  contents:
  - resid_acf
  - partial_dependence
  - cv_speakers
  - theme_paper
- title: Package
  contents:
  - konstats-package
